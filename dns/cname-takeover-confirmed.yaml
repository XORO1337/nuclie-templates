            contains(cname, 'strikingly.com') ||
            contains(cname, 'squarespace.com') ||
            contains(cname, 'smugmug.com') ||
            contains(cname, 'teamwork.com') ||
            contains(cname, 'helpscout.net') ||
            contains(cname, 'helpjuice.com') ||
            contains(cname, 'uservoice.com') ||
            contains(cname, 'announcekit.app') ||
            contains(cname, 'gitbook.io') ||
            contains(cname, 'jetbrains.space') ||
            contains(cname, 'ngrok.io') ||
            contains(cname, 'ngrok-free.app') ||
            contains(cname, 'pingdom.com') ||
            contains(cname, 'uptimerobot.com') ||
            contains(cname, 'worksites.net') ||
            contains(cname, 'squadcast.com') ||
            contains(cname, 'tave.com') ||
