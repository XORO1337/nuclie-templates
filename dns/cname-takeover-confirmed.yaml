id: cname_takeover_2

info:
  name: CNAME Takeover - Provider Unclaimed Page
  author: XORO1337
  severity: high
  description: |
    The hostname has a CNAME pointing at a third-party service, and the HTTP
    response contains that service's "resource not found / unclaimed" page.
    This is stronger evidence than a dangling CNAME alone, but the provider
    still has to allow the specific resource name to be claimed.

    Confirm by attempting to create the resource in an authorized account, or
    by checking the provider API, before reporting.
  impact: |
    If the CNAME target can be claimed, an attacker can host arbitrary content
    on the organization's subdomain and abuse its trust, cookies, and origin.
  remediation: |
    Remove the stale CNAME or reclaim the target resource. Add automated checks
    for CNAME targets that return provider-specific unclaimed-resource pages.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
    - https://docs.microsoft.com/en-us/azure/security/fundamentals/subdomain-takeover
  classification:
    cwe-id: CWE-404
  metadata:
    max-request: 2
  tags: dns,takeover,cname,http

dns:
  - name: "{{FQDN}}"
    type: A
    class: inet
    recursion: true
    retries: 3

    extractors:
      - type: dsl
        name: cname
        dsl:
          - cname
        internal: true

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        condition: and
        dsl:
          - |
            contains(cname, 'github.io') ||
            contains(cname, 'github.com') ||
            contains(cname, 'herokuapp.com') ||
            contains(cname, 'herokudns.com') ||
            contains(cname, 's3.amazonaws.com') ||
            contains(cname, 'amazonaws.com') ||
            contains(cname, 'cloudfront.net') ||
            contains(cname, 'azurewebsites.net') ||
            contains(cname, 'cloudapp.azure.com') ||
            contains(cname, 'azurefd.net') ||
            contains(cname, 'trafficmanager.net') ||
            contains(cname, 'blob.core.windows.net') ||
            contains(cname, 'netlify.app') ||
            contains(cname, 'netlify.com') ||
            contains(cname, 'vercel.app') ||
            contains(cname, 'vercel-dns.com') ||
            contains(cname, 'surge.sh') ||
            contains(cname, 'bitbucket.io') ||
            contains(cname, 'ghost.io') ||
            contains(cname, 'pantheonsite.io') ||
            contains(cname, 'wpengine.com') ||
            contains(cname, 'zendesk.com') ||
            contains(cname, 'readme.io') ||
            contains(cname, 'readthedocs.io') ||
            contains(cname, 'statuspage.io') ||
            contains(cname, 'fastly.net') ||
            contains(cname, 'myshopify.com') ||
            contains(cname, 'shopify.com') ||
            contains(cname, 'tumblr.com') ||
            contains(cname, 'wordpress.com') ||
            contains(cname, 'cargo.site') ||
            contains(cname, 'unbounce.com') ||
