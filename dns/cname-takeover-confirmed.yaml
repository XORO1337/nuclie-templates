            contains(cname, 'wishpond.com') ||
            contains(cname, 'greatpages.com') ||
            contains(cname, 'gohire.com') ||
            contains(cname, 'jazzhr.com') ||
            contains(cname, 'smartjob.com') ||
            contains(cname, 'flexbe.com') ||
            contains(cname, 'frontify.com') ||
            contains(cname, 'gemfury.com') ||
            contains(cname, 'getresponse.com') ||
